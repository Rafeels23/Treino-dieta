<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f1">
  <script>
    /* aplica o tema escolhido antes da tela aparecer (sem piscar) */
    (function () {
      var p = 'auto'; try { p = localStorage.getItem('pilar-theme') || 'auto'; } catch (e) {}
      var d = p === 'dark' || (p === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
      document.documentElement.style.colorScheme = d ? 'dark' : 'light';
      document.documentElement.style.setProperty('--bg-inicial', d ? '#0c0d0f' : '#f6f5f1');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', d ? '#0c0d0f' : '#f6f5f1');
      /* cor principal escolhida no Perfil (mesma tabela de src/lib/theme.js; padrão: laranja) */
      var cores = { verde: ['#237a3b', '#3dbb63', ['#c2410c', '#f08c45']], laranja: ['#c4481d', '#ee5a2b'], vermelho: ['#d6303a', '#f2545b'],
        rosa: ['#d1366f', '#f06595'], roxo: ['#7048e8', '#9b7bff'], azul: ['#1f6fd1', '#4f9ff5', null, ['#7048e8', '#9b7bff']] };
      var c = cores.laranja; try { c = cores[localStorage.getItem('pilar-cor')] || cores.laranja; } catch (e) {}
      var st = document.documentElement.style, i = d ? 1 : 0;
      var mix = function (x) { return 'color-mix(in srgb, ' + x + ' ' + (d ? 22 : 14) + '%, ' + (d ? '#141619' : '#ffffff') + ')'; };
      st.setProperty('--c-treino', c[i]); st.setProperty('--treino-soft', mix(c[i])); st.setProperty('--accent-ink', d ? '#111214' : '#ffffff');
      if (c[2]) { st.setProperty('--c-dieta', c[2][i]); st.setProperty('--dieta-soft', mix(c[2][i])); }
      if (c[3]) { st.setProperty('--c-rotina', c[3][i]); st.setProperty('--rotina-soft', mix(c[3][i])); }
    })();
  </script>
  <title>Pilar</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pilar">
</head>
<body>
  <div id="root">
    <!-- logo na hora, antes do app carregar (o React substitui) -->
    <div style="min-height:100vh;display:grid;place-items:center;background:var(--bg-inicial)">
      <svg width="72" height="72" viewBox="0 0 512 512" aria-label="Pilar">
        <rect x="150" y="212" width="78" height="184" rx="39" fill="var(--c-treino, #c4481d)" />
        <rect x="284" y="132" width="78" height="264" rx="39" fill="var(--c-dieta, #0c7d69)" />
      </svg>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
