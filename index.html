<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f1">
  <script>
    /* aplica o tema escolhido antes da tela aparecer (sem piscar) */
    (function () {
      var p = 'auto'; try { p = localStorage.getItem('pilar-theme') || 'auto'; } catch (e) {}
      var d = p === 'dark' || (p === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
      document.documentElement.style.colorScheme = d ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', d ? '#0c0d0f' : '#f6f5f1');
    })();
  </script>
  <title>Pilar</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pilar">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
