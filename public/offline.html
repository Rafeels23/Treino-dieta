<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilar</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #0a0b0d; color: #f2f1ec; text-align: center; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: light) { body { background: #f6f5f1; color: #141518; } p { color: #555 !important; } }
  h1 { font-size: 24px; margin: 16px 0 8px; }
  p { color: #a9abb2; margin: 0 0 24px; line-height: 1.45; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 14px 28px; background: #ee5a2b; color: #fff; }
  .logo { font-size: 44px; }
</style>
</head>
<body>
  <main>
    <div class="logo">🏋️</div>
    <h1>Sem internet</h1>
    <p>Na primeira vez, o Pilar precisa de internet para baixar a versão mais nova.<br>Depois ele funciona offline.</p>
    <button onclick="location.href='https://pilar-treino.vercel.app/'">Tentar de novo</button>
  </main>
</body>
</html>
